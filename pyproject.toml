[project]
name = "finfilings"
version = "0.0.1"
description = "Agentic RAG with evaluation over SEC 10-K filings of fintech companies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
# Stage 0 keeps runtime dependencies minimal. Each later stage adds only what it needs
# (Stage 1: requests; Stage 2: beautifulsoup4, lxml; Stage 3: sentence-transformers, ...).
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "pre-commit>=3.7,<5",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finfilings"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test needs internet access (excluded from CI)",
    "llm: test calls a paid LLM API (excluded from CI)",
]
